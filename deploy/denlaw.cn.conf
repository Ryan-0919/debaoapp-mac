map $http_upgrade $debao_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name debao-api.denlaw.cn debao.denlaw.cn debao-admin.denlaw.cn debao-learning.denlaw.cn debao-grading.denlaw.cn debao-media.denlaw.cn;
    location ^~ /.well-known/acme-challenge/ { root /opt/debao/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name debao-api.denlaw.cn;
    ssl_certificate /etc/debao/tls/debaoapp.fullchain.cer;
    ssl_certificate_key /etc/debao/tls/debaoapp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512m;
    access_log /www/wwwlogs/debao-api.access.log;
    error_log /www/wwwlogs/debao-api.error.log;
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $debao_connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name debao.denlaw.cn;
    ssl_certificate /etc/debao/tls/debaoapp.fullchain.cer;
    ssl_certificate_key /etc/debao/tls/debaoapp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/debao/current/debao-flutter-web;
    index index.html;
    client_max_body_size 512m;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~ /\. { deny all; }
}

server {
    listen 443 ssl;
    server_name debao-admin.denlaw.cn debao-learning.denlaw.cn debao-grading.denlaw.cn;
    ssl_certificate /etc/debao/tls/debaoapp.fullchain.cer;
    ssl_certificate_key /etc/debao/tls/debaoapp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/debao/current/debao-admin/dist;
    index index.html;
    client_max_body_size 512m;
    location /v1/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~ /\. { deny all; }
}

server {
    listen 443 ssl;
    server_name debao-media.denlaw.cn;
    ssl_certificate /etc/debao/tls/debaoapp.fullchain.cer;
    ssl_certificate_key /etc/debao/tls/debaoapp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512m;
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
